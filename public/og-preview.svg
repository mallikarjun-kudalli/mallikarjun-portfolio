<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090a0f"/>
      <stop offset="100%" stop-color="#0e1322"/>
    </linearGradient>
    <radialGradient id="glow-emerald" cx="80%" cy="20%" r="50%">
      <stop offset="0%" stop-color="rgba(16, 185, 129, 0.12)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <radialGradient id="glow-cyan" cx="20%" cy="80%" r="50%">
      <stop offset="0%" stop-color="rgba(6, 182, 212, 0.08)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow-emerald)"/>
  <rect width="1200" height="630" fill="url(#glow-cyan)"/>

  <!-- Border Hairline Frame -->
  <rect x="32" y="32" width="1136" height="566" rx="16" fill="none" stroke="#202738" stroke-width="1.5"/>

  <!-- Brand Monogram -->
  <rect x="80" y="80" width="56" height="56" rx="10" fill="#111827" stroke="#202738" stroke-width="1.5"/>
  <text x="108" y="117" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'JetBrains Mono', monospace" font-size="22" font-weight="bold" fill="#f8fafc" text-anchor="middle">MK</text>
  <circle cx="148" cy="92" r="4" fill="#10b981"/>

  <!-- Technical Status Kicker -->
  <rect x="170" y="92" width="180" height="32" rx="6" fill="#111827" stroke="#202738" stroke-width="1"/>
  <circle cx="186" cy="108" r="4" fill="#10b981"/>
  <text x="200" y="113" font-family="'JetBrains Mono', monospace" font-size="12" fill="#10b981" font-weight="600" letter-spacing="1">SYS_STATUS: ACTIVE</text>

  <!-- Candidate Identity -->
  <text x="80" y="220" font-family="'JetBrains Mono', monospace" font-size="22" fill="#10b981" font-weight="500" letter-spacing="0.5">Mallikarjun Kudalli</text>
  <text x="80" y="255" font-family="'JetBrains Mono', monospace" font-size="16" fill="#64748b">Computer Science &amp; Engineering (Data Science) // RNSIT</text>

  <!-- Editorial Headline -->
  <text x="80" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" fill="#f8fafc" font-weight="bold" letter-spacing="-1">
    Building software where data meets intelligence.
  </text>

  <!-- Positioning Subheading -->
  <text x="80" y="405" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" fill="#94a3b8" font-weight="300">
    Computer Science &amp; Data Science student building full-stack applications, data analytics solutions
  </text>
  <text x="80" y="435" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" fill="#94a3b8" font-weight="300">
    and machine-learning systems.
  </text>

  <!-- Technical Highlights Row -->
  <g transform="translate(80, 490)">
    <rect width="280" height="54" rx="8" fill="#111827" stroke="#202738" stroke-width="1"/>
    <text x="20" y="32" font-family="'JetBrains Mono', monospace" font-size="13" fill="#10b981" font-weight="bold">100,000+ Records</text>
    <text x="20" y="45" font-family="'JetBrains Mono', monospace" font-size="9" fill="#64748b">Fintech Analytics Dashboard</text>

    <rect x="300" width="280" height="54" rx="8" fill="#111827" stroke="#202738" stroke-width="1"/>
    <text x="320" y="32" font-family="'JetBrains Mono', monospace" font-size="13" fill="#06b6d4" font-weight="bold">CNN Forensics</text>
    <text x="320" y="45" font-family="'JetBrains Mono', monospace" font-size="9" fill="#64748b">Image Forgery Detection</text>

    <rect x="600" width="280" height="54" rx="8" fill="#111827" stroke="#202738" stroke-width="1"/>
    <text x="620" y="32" font-family="'JetBrains Mono', monospace" font-size="13" fill="#f8fafc" font-weight="bold">100+ Solved</text>
    <text x="620" y="45" font-family="'JetBrains Mono', monospace" font-size="9" fill="#64748b">LeetCode Algorithmic Practice</text>
  </g>
